name: Build Turnip for Dipper

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      ANDROID_PLATFORM: 35
      MESA_BUILD_DIR: build
      MESA_INSTALL_DIR: install

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            python3-packaging \
            ninja-build \
            pkg-config \
            meson \
            build-essential \
            clang \
            llvm \
            libglvnd-dev \
            glslang-tools \
            bison \
            flex \
            libdrm-dev \
            libexpat1-dev \
            libudev-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-xcb-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxshmfence-dev \
            libxxf86vm-dev \
            libvulkan-dev \
            zlib1g-dev

      - name: Setup Python build environment
        run: |
          python3 -m venv .venv

          . .venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install \
            meson \
            packaging \
            setuptools \
            wheel \
            mako \
            ply \
            pyyaml

          meson --version
          python --version

      - name: Locate Android SDK
        run: |
          set -eux

          SDKMANAGER=""

          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

            find "$HOME" -name sdkmanager -type f 2>/dev/null || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using sdkmanager: $SDKMANAGER"

      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android NDK r29 and platform 35
        run: |
          set -eux

          "$SDKMANAGER" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"

      - name: Verify Android toolchain
        run: |
          set -eux

          ls -lah "$ANDROID_NDK_HOME"

          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" \
            --version

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++" \
            --version

      - name: Clone Mesa
        run: |
          set -eux

          git clone --depth=1 \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            mesa

          cd mesa

          echo "Mesa commit:"
          git rev-parse HEAD

          echo "Mesa version:"
          grep -n "MESA_VERSION" meson.build | head -10 || true

      - name: Prepare Meson cross file
        run: |
          set -eux

          cat > android-aarch64.ini <<EOF
          [binaries]
          c = '${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang'
          cpp = '${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++'
          ar = '${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          ranlib = '${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
          ld = '${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'

          [properties]
          sys_root = '${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot'
          EOF

          cat android-aarch64.ini

      - name: Configure Mesa
        run: |
          set -eux

          source .venv/bin/activate

          cd mesa

          meson setup "../${MESA_BUILD_DIR}" \
            --cross-file ../android-aarch64.ini \
            --prefix="/system" \
            --libdir="lib64" \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version="${ANDROID_PLATFORM}" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl

      - name: Build Mesa Turnip
        run: |
          set -eux

          source .venv/bin/activate

          meson compile \
            -C "${MESA_BUILD_DIR}" \
            -j"$(nproc)"

      - name: Find Turnip library
        run: |
          set -eux

          echo "Searching for Vulkan Turnip library..."

          find "${MESA_BUILD_DIR}" \
            -type f \
            \( \
              -name "libvulkan_freedreno.so" \
              -o \
              -name "vulkan.turnip.so" \
            \) \
            -print

      - name: Inspect Turnip library
        run: |
          set -eux

          DRIVER="$(find "${MESA_BUILD_DIR}" \
            -type f \
            -name "libvulkan_freedreno.so" \
            | head -n 1)"

          if [ -z "$DRIVER" ]; then
            echo "libvulkan_freedreno.so not found"
            exit 1
          fi

          echo "Driver:"
          echo "$DRIVER"

          mkdir -p "${MESA_INSTALL_DIR}"

          cp "$DRIVER" "${MESA_INSTALL_DIR}/libvulkan_freedreno.so"

          echo
          echo "===== FILE ====="
          file "${MESA_INSTALL_DIR}/libvulkan_freedreno.so"

          echo
          echo "===== ELF HEADER ====="
          readelf -h "${MESA_INSTALL_DIR}/libvulkan_freedreno.so"

          echo
          echo "===== SONAME / NEEDED ====="
          readelf -d "${MESA_INSTALL_DIR}/libvulkan_freedreno.so" \
            | grep -E 'SONAME|NEEDED' || true

          echo
          echo "===== TURNIP / MESA / GPU STRINGS ====="
          strings "${MESA_INSTALL_DIR}/libvulkan_freedreno.so" \
            | grep -iE 'Mesa|turnip|FD630|Adreno|KGSL|Vulkan 1\.[0-9]' \
            | sort -u \
            | head -100 || true

          echo
          echo "===== FILE SIZE ====="
          ls -lh "${MESA_INSTALL_DIR}/libvulkan_freedreno.so"

      - name: Package Turnip
        run: |
          set -eux

          mkdir -p package/vendor/lib64/hw

          cp \
            "${MESA_INSTALL_DIR}/libvulkan_freedreno.so" \
            package/vendor/lib64/hw/

          cat > package/README.txt <<EOF
          Turnip build for Xiaomi Mi 8 / dipper

          GPU:
            Qualcomm Adreno 630

          Kernel interface:
            KGSL

          Android target:
            Android ${ANDROID_PLATFORM}

          NDK:
            ${ANDROID_NDK_VERSION}

          Driver:
            libvulkan_freedreno.so

          Mesa source:
            $(cd mesa && git rev-parse HEAD)

          Build date:
            $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF

          tar -czf \
            "turnip-1.4-se-dipper-android35.tar.gz" \
            -C package .

          echo
          echo "===== PACKAGE ====="
          ls -lh turnip-1.4-se-dipper-android35.tar.gz

      - name: Upload Turnip artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-1.4-se-dipper-android35
          path: |
            turnip-1.4-se-dipper-android35.tar.gz
            install/libvulkan_freedreno.so
          if-no-files-found: error
