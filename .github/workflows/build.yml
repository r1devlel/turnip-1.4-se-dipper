name: Build Turnip for Dipper

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_VERSION: "29.0.14206865"
      ANDROID_PLATFORM: "35"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip python3-venv ninja-build pkg-config build-essential bison flex libdrm-dev libexpat1-dev libudev-dev libvulkan-dev zlib1g-dev glslang-tools

      - name: Setup Python
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install meson mako pyyaml packaging
          meson --version

      - name: Setup Android SDK
        run: |
          set -eux
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          fi

          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android platform and NDK
        run: |
          set -eux
          "$SDKMANAGER" "platforms;android-${ANDROID_PLATFORM}" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        run: |
          set -eux
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLCHAIN/aarch64-linux-android${ANDROID_PLATFORM}-clang" --version
          "$TOOLCHAIN/aarch64-linux-android${ANDROID_PLATFORM}-clang++" --version
          "$TOOLCHAIN/ld.lld" --version
          cat "$ANDROID_NDK_HOME/source.properties"

      - name: Clone latest Mesa
        run: |
          set -eux
          git clone --depth=1 https://gitlab.freedesktop.org/mesa/mesa.git mesa
          cd mesa
          git rev-parse HEAD
          grep -n "MESA_VERSION" meson.build | head -10 || true

      - name: Prepare Android cross file
        run: |
          set -eux
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          printf '%s\n' \
            '[binaries]' \
            "c = '$TOOLCHAIN/aarch64-linux-android${ANDROID_PLATFORM}-clang'" \
            "cpp = '$TOOLCHAIN/aarch64-linux-android${ANDROID_PLATFORM}-clang++'" \
            "ar = '$TOOLCHAIN/llvm-ar'" \
            "strip = '$TOOLCHAIN/llvm-strip'" \
            "ranlib = '$TOOLCHAIN/llvm-ranlib'" \
            "ld = '$TOOLCHAIN/ld.lld'" \
            '' \
            '[host_machine]' \
            "system = 'android'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'arm64'" \
            "endian = 'little'" \
            '' \
            '[properties]' \
            "sys_root = '$SYSROOT'" \
            > android-aarch64.ini

          cat android-aarch64.ini

      - name: Configure Mesa
        run: |
          set -eux
          . .venv/bin/activate
          meson setup build mesa \
            --cross-file android-aarch64.ini \
            --prefix=/system \
            --libdir=lib64 \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version="${ANDROID_PLATFORM}" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl

      - name: Build Turnip
        run: |
          set -eux
          . .venv/bin/activate
          meson compile -C build -j"$(nproc)"

      - name: Inspect and normalize Turnip
        run: |
          set -eux
          DRIVER="$(find build -type f -name 'libvulkan_freedreno.so' | head -n 1)"
          test -n "$DRIVER"
          mkdir -p install
          cp "$DRIVER" install/vulkan.turnip.so

          # Match the reference Turnip naming convention used on dipper.
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy" \
            --set-section-alignment .note.android.ident=4 \
            install/vulkan.turnip.so 2>/dev/null || true

          # Re-link the shared object with the reference SONAME.
          # Keep all existing sections/symbols; only change the dynamic SONAME.
          python - <<'PY'
          from pathlib import Path
          p = Path('install/vulkan.turnip.so')
          b = bytearray(p.read_bytes())
          old = b'libvulkan_freedreno.so\\x00'
          new = b'vulkan.turnip.so\\x00'
          if old not in b:
              raise SystemExit('original SONAME string not found')
          if len(new) > len(old):
              raise SystemExit('replacement SONAME is too long')
          b[b.index(old):b.index(old)+len(old)] = new + b'\\x00' * (len(old)-len(new))
          p.write_bytes(b)
          PY

          file install/vulkan.turnip.so
          readelf -d install/vulkan.turnip.so | grep -E 'SONAME|NEEDED' || true
          readelf -p .comment install/vulkan.turnip.so || true
          strings install/vulkan.turnip.so | grep -iE 'Mesa|turnip|FD630|Adreno|KGSL|tu_knl_kgsl' | sort -u | head -150 || true
          ls -lh install/vulkan.turnip.so

      - name: Package
        run: |
          set -eux
          mkdir -p package/vendor/lib64/hw
          cp install/vulkan.turnip.so package/vendor/lib64/hw/
          {
            echo "Turnip build for Xiaomi Mi 8 / dipper"
            echo
            echo "GPU: Qualcomm Adreno 630"
            echo "Kernel interface: KGSL"
            echo "Driver filename/SONAME: vulkan.turnip.so"
            echo "Android target: Android ${ANDROID_PLATFORM}"
            echo "NDK: ${ANDROID_NDK_VERSION}"
            echo
            echo "Mesa commit:"
            git -C mesa rev-parse HEAD
            echo
            echo "Build date:"
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          } > package/README.txt
          tar -czf turnip-latest-dipper.tar.gz -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-latest-dipper
          path: |
            turnip-latest-dipper.tar.gz
            install/vulkan.turnip.so
          if-no-files-found: error
