name: Build Turnip 1.4 SE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_PLATFORM: 34

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            ninja-build \
            python3 \
            python3-venv \
            python3-pip \
            python3-mako \
            python3-ply \
            python3-setuptools \
            python3-packaging \
            bison \
            flex \
            gettext \
            pkg-config \
            glslang-tools \
            libglvnd-dev \
            libdrm-dev \
            libelf-dev \
            libexpat1-dev \
            zlib1g-dev \
            libzstd-dev \
            cmake

      - name: Install Meson
        run: |
          python3 -m venv "$RUNNER_TEMP/meson-venv"

          "$RUNNER_TEMP/meson-venv/bin/python" \
            -m pip install --upgrade pip

          "$RUNNER_TEMP/meson-venv/bin/python" \
            -m pip install "meson>=1.4.0"

          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/meson-venv/bin/meson" --version

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"

          echo "Using sdkmanager: $SDKMANAGER"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Verify Android NDK
        run: |
          test -d "$ANDROID_NDK"

          echo "NDK: $ANDROID_NDK"

          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang" \
            --version

      - name: Clone Mesa
        run: |
          git clone --depth=1 \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa

          cd mesa
          git log -1 --oneline

      - name: Create Android cross file
        run: |
          mkdir -p "$RUNNER_TEMP/meson-cross"

          cat > "$RUNNER_TEMP/meson-cross/android-aarch64.ini" <<EOF
          [constants]
          ndk_path = '$ANDROID_NDK'
          toolchain = ndk_path / 'toolchains/llvm/prebuilt/linux-x86_64/bin'

          [binaries]
          ar = toolchain / 'llvm-ar'
          c = toolchain / 'aarch64-linux-android34-clang'
          cpp = toolchain / 'aarch64-linux-android34-clang++'
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = toolchain / 'aarch64-linux-android-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          echo "=== Android cross file ==="
          cat "$RUNNER_TEMP/meson-cross/android-aarch64.ini"

      - name: Configure Turnip
        working-directory: mesa
        run: |
          meson setup build-android-aarch64 \
            --cross-file "$RUNNER_TEMP/meson-cross/android-aarch64.ini" \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=${ANDROID_PLATFORM} \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl

      - name: Build Turnip
        working-directory: mesa
        run: |
          meson compile -C build-android-aarch64

      - name: Find Turnip
        run: |
          echo "=== Searching for Turnip ==="

          find mesa/build-android-aarch64 \
            -type f \
            \( \
              -name 'libvulkan_freedreno.so' \
              -o -name '*freedreno*.so' \
              -o -name '*turnip*.so' \
            \) \
            -print

      - name: Collect artifacts
        run: |
          mkdir -p dist

          find mesa/build-android-aarch64 \
            -type f \
            \( \
              -name 'libvulkan_freedreno.so' \
              -o -name '*freedreno*.so' \
              -o -name '*turnip*.so' \
            \) \
            -exec cp -v {} dist/ \; || true

          echo "=== Artifact ==="
          find dist -type f -ls

          if [ -z "$(find dist -type f -print -quit)" ]; then
            echo "ERROR: No Turnip library was produced."
            exit 1
          fi

          tar -czf \
            turnip-1.4-se-dipper-android.tar.gz \
            -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-1.4-se-dipper-android
          path: turnip-1.4-se-dipper-android.tar.gz
