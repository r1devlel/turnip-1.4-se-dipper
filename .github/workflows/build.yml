name: Build Turnip for Dipper

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        variant:
          - os-v14
          - vk13-stable

    env:
      ANDROID_NDK_VERSION: "30.0.16248370"
      ANDROID_PLATFORM: "37"
      # Latest Mesa main as of 2026-11-11 (Mesa 27.0.0-devel).
      # Pin the commit so the Android 17 build is reproducible.
      MESA_REPO: "https://gitlab.freedesktop.org/mesa/mesa.git"
      MESA_REF: "e04357c464296e6b0a0bda612d5b2fb5deb6fa82"
      VARIANT: "${{ matrix.variant }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip python3-venv ninja-build pkg-config build-essential bison flex libdrm-dev libexpat1-dev libudev-dev libvulkan-dev zlib1g-dev glslang-tools patchelf patch

      - name: Setup Python
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install meson mako pyyaml packaging
          meson --version

      - name: Setup Android SDK
        run: |
          set -eux
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          fi

          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android NDK
        run: |
          set -eux
          "$SDKMANAGER" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_PLATFORM}-clang"

      - name: Verify Android toolchain
        run: |
          set -eux
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLCHAIN/aarch64-linux-android${ANDROID_PLATFORM}-clang" --version
          "$TOOLCHAIN/aarch64-linux-android${ANDROID_PLATFORM}-clang++" --version
          "$TOOLCHAIN/ld.lld" --version
          cat "$ANDROID_NDK_HOME/source.properties"

      - name: Fetch pinned Mesa
        run: |
          set -eux
          git init mesa
          git -C mesa remote add origin "$MESA_REPO"
          git -C mesa fetch --depth=1 origin "$MESA_REF"
          git -C mesa checkout --detach FETCH_HEAD
          git -C mesa rev-parse HEAD
          grep -n "MESA_VERSION" mesa/meson.build | head -10 || true

      - name: Apply A630 Vulkan 1.4 patch
        if: matrix.variant == 'os-v14'
        run: |
          set -eux
          patch -p1 -d mesa < patches/0001-tu-expose-vk14-on-a630.patch
          grep -n -A4 'props->apiVersion' mesa/src/freedreno/vulkan/tu_device.cc

      - name: Prepare Android cross file
        run: |
          set -eux
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          printf '%s\n' \
            '[binaries]' \
            "c = '$TOOLCHAIN/aarch64-linux-android${ANDROID_PLATFORM}-clang'" \
            "cpp = '$TOOLCHAIN/aarch64-linux-android${ANDROID_PLATFORM}-clang++'" \
            "ar = '$TOOLCHAIN/llvm-ar'" \
            "strip = '$TOOLCHAIN/llvm-strip'" \
            "ranlib = '$TOOLCHAIN/llvm-ranlib'" \
            "ld = '$TOOLCHAIN/ld.lld'" \
            '' \
            '[host_machine]' \
            "system = 'android'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'arm64'" \
            "endian = 'little'" \
            '' \
            '[built-in options]' \
            "cpp_link_args = ['-static-libstdc++']" \
            '' \
            '[properties]' \
            "sys_root = '$SYSROOT'" \
            > android-aarch64.ini

          cat android-aarch64.ini

      - name: Configure Mesa
        run: |
          set -eux
          . .venv/bin/activate

          MESON_ARGS=(
            --cross-file android-aarch64.ini
            --prefix=/system
            --libdir=lib64
            --buildtype=release
            -Dplatforms=android
            -Dplatform-sdk-version="${ANDROID_PLATFORM}"
            -Dandroid-stub=true
            -Dandroid-libbacktrace=disabled
            -Dandroid-libperfetto=disabled
            -Degl=disabled
            -Dgles1=disabled
            -Dgles2=disabled
            -Dopengl=false
            -Dglx=disabled
            -Dgbm=disabled
            -Dgallium-drivers=
            -Dvulkan-drivers=freedreno
            -Dfreedreno-kmds=kgsl
            -Dllvm=disabled
            -Dzstd=disabled
            -Dshader-cache=enabled
            -Dbuild-tests=false
          )

          if [ "$VARIANT" = "os-v14" ]; then
            MESON_ARGS+=(-Dvulkan-beta=false)
          fi

          meson setup build mesa "${MESON_ARGS[@]}"

      - name: Build Turnip
        run: |
          set -eux
          . .venv/bin/activate
          meson compile -C build -j"$(nproc)"

      - name: Inspect and normalize Turnip
        run: |
          set -eux
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          DRIVER="$(find build -type f -name 'libvulkan_freedreno.so' | head -n 1)"
          test -n "$DRIVER"
          mkdir -p install
          cp "$DRIVER" install/vulkan.turnip.so

          # Keep the size closer to the reference Android driver and avoid
          # shipping local symbols in the runtime artifact.
          "$TOOLCHAIN/llvm-strip" --strip-unneeded install/vulkan.turnip.so

          # Match the reference Turnip naming convention used on dipper.
          # patchelf updates the ELF dynamic SONAME instead of editing raw strings.
          patchelf --set-soname vulkan.turnip.so install/vulkan.turnip.so

          file install/vulkan.turnip.so
          readelf -d install/vulkan.turnip.so | grep -E 'SONAME|NEEDED' || true
          readelf -p .comment install/vulkan.turnip.so || true
          strings install/vulkan.turnip.so | grep -iE 'Mesa|turnip|FD630|Adreno|KGSL|tu_knl_kgsl' | sort -u | head -150 || true
          ls -lh install/vulkan.turnip.so

          case "$VARIANT" in
            os-v14)
              grep -q 'fd_dev_gpu_id(&pdevice->dev_id) == 630' mesa/src/freedreno/vulkan/tu_device.cc
              echo "A630 Vulkan 1.4 patch present"
              ;;
            *)
              echo "Upstream Vulkan 1.3 build"
              ;;
          esac

      - name: Package
        run: |
          set -eux
          mkdir -p package/vendor/lib64/hw
          cp install/vulkan.turnip.so package/vendor/lib64/hw/
          {
            echo "Turnip build for Xiaomi Mi 8 / dipper"
            echo
            echo "Variant: ${VARIANT}"
            echo "GPU: Qualcomm Adreno 630"
            echo "Kernel interface: KGSL"
            echo "Driver filename/SONAME: vulkan.turnip.so"
            echo "Android target: Android ${ANDROID_PLATFORM} (API ${ANDROID_PLATFORM})"
            echo "NDK: ${ANDROID_NDK_VERSION}"
            echo
            echo "Mesa commit:"
            git -C mesa rev-parse HEAD
            echo
            echo "Build date:"
            date -u '+%Y-%m-%d %H:%M:%S UTC'
            echo
            if [ "$VARIANT" = "os-v14" ]; then
              echo "Android 17 / API 37 OS-optimized build."
              echo "Vulkan-only, KGSL-only, release -O3, stripped, no GL/EGL/tools/tests."
              echo "Advertises Vulkan 1.4 on A630 for HyperOS 4 glass rendering."
              echo "Experimental: upstream keeps A6xx at Vulkan 1.3 because not"
              echo "every 1.4 limit is met."
            else
              echo "Upstream-compatible Vulkan 1.3 build."
              echo "Use it for games or as a fallback if the 1.4 path is unstable."
            fi
          } > package/README.txt
          tar -czf "turnip-${VARIANT}-dipper.tar.gz" -C package .
          sha256sum "turnip-${VARIANT}-dipper.tar.gz" install/vulkan.turnip.so > "turnip-${VARIANT}-dipper.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ matrix.variant }}-dipper
          path: |
            turnip-${{ matrix.variant }}-dipper.tar.gz
            turnip-${{ matrix.variant }}-dipper.sha256
            install/vulkan.turnip.so
          if-no-files-found: error
